name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Runtime healing with the real Bubblegum engine: a stale page-object locator fails with healing off and is
  # healed (and listed by `qa-sentinel healed`) with QA_HEALING=bubblegum.
  bubblegum-healing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci && npm run build
      - run: bash sandbox/bubblegum/e2e.sh "$RUNNER_TEMP/healing"
