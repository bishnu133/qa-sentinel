# qa-sentinel – SERVICE repo pipeline (Phase 1 gap report + Phase 2 trigger)
#
# Include from each service repo's .gitlab-ci.yml:
#   include:
#     - project: "my-group/qa-tests"          # your test repo
#       ref: {{targetBranch}}
#       file: "{{testsPrefix}}ci/qa-sentinel/service.gitlab-ci.yml"
#   variables:
#     QA_TESTS_PROJECT: "my-group/qa-tests"
#
# CI/CD variables (masked, protected): ANTHROPIC_API_KEY, QA_SENTINEL_GITLAB_TOKEN (api scope)
# Model through Amazon Bedrock or Google Vertex AI instead of an Anthropic key: CLAUDE_CODE_USE_BEDROCK=1 + AWS_REGION
# + AWS credentials (or a runner role), or CLAUDE_CODE_USE_VERTEX=1 + CLOUD_ML_REGION + ANTHROPIC_VERTEX_PROJECT_ID + GCP credentials.
# The service's name in qa-sentinel.config.yaml must equal $CI_PROJECT_NAME (or set QA_SERVICE_NAME).

variables:
  QA_SENTINEL_VERSION: "0.8.0-beta.1"
  # Where to install qa-sentinel from: set QA_SENTINEL_PACKAGE as a group/project CI/CD variable, e.g.
  # "github:bishnu133/qa-sentinel#main" until it is on npm. Default: qa-sentinel@$QA_SENTINEL_VERSION.
  # (Not defined here on purpose: trigger jobs forward YAML variables downstream, where they override CI/CD variables.)
  QA_SERVICE_NAME: "$CI_PROJECT_NAME"

# Install qa-sentinel from QA_SENTINEL_PACKAGE. A GitHub source ("github:owner/repo#branch") is cloned, built and
# packed here first: npm's own build-on-install for git dependencies is unreliable for global installs.
.qa-sentinel-install:
  script:
    - |
      qa_pkg="${QA_SENTINEL_PACKAGE:-qa-sentinel@${QA_SENTINEL_VERSION}}"
      case "$qa_pkg" in
        github:*|git+https://github.com/*|https://github.com/*)
          src="${qa_pkg#github:}"; src="${src#git+}"; src="${src#https://github.com/}"
          repo="${src%%#*}"; repo="${repo%.git}"; ref="main"
          case "$src" in *"#"*) ref="${src#*#}" ;; esac
          rm -rf /tmp/qa-sentinel-src /tmp/qa-sentinel-*.tgz
          git clone -q --depth 1 --branch "$ref" "https://github.com/${repo}.git" /tmp/qa-sentinel-src
          (cd /tmp/qa-sentinel-src && npm ci --no-audit --no-fund --loglevel=error && npm pack --silent --pack-destination /tmp > /dev/null)
          qa_pkg="$(ls /tmp/qa-sentinel-*.tgz | head -n 1)"
          ;;
      esac
      npm i -g --no-audit --no-fund --loglevel=error "$qa_pkg"
      qa-sentinel --version

.qa-sentinel:
  image: node:22
  variables:
    GIT_DEPTH: 0
    # The test repo's folder inside its repository (a monorepo package), or the repository itself. A job variable,
    # so trigger jobs don't forward it downstream.
    QA_TESTS_DIR: "/tmp/qa-tests{{#if testsSubdir}}/{{testsSubdir}}{{/if}}"
  before_script:
    - npm i -g --no-audit --no-fund --loglevel=error @anthropic-ai/claude-code
    - !reference [.qa-sentinel-install, script]
    - git clone --depth 1 --branch {{targetBranch}} "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${QA_TESTS_PROJECT}.git" /tmp/qa-tests
    - git -C /tmp/qa-tests remote remove origin   # no token in .git/config for the agent to read
    - (cd "$QA_TESTS_DIR" && if [ -f package-lock.json ]; then npm ci --ignore-scripts; else cd /tmp/qa-tests && npm ci --ignore-scripts; fi)

# Phase 1: read-only QA impact comment on every MR. Never blocks the MR.
qa-gap-report:
  extends: .qa-sentinel
  stage: test
  rules:
{{#if skipBranchesRe}}
    # ci.skipBranches (dependency bots): no gap report.
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /{{skipBranchesRe}}/
      when: never
{{/if}}
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true
  interruptible: true
  script:
    - >
      qa-sentinel -C "$QA_TESTS_DIR" gap-report
      --service "$QA_SERVICE_NAME" --service-path "$CI_PROJECT_DIR"
      --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head "$CI_COMMIT_SHA" --checkout
      --out "$CI_PROJECT_DIR/qa-gap-report.md" --post
  artifacts:
    when: always
    paths: [qa-gap-report.md]
    expire_in: 2 weeks

{{#if isMaintenance}}
# Phase 2: ask the test repo to generate/update tests for the merged change.
# By default this runs right after the merge. If the tests must run against an environment the change is deployed to
# first (dev/SIT), set QA_GENERATE_AFTER: "deploy" in this project and add a job after your deploy job:
#
#   qa-generate-after-deploy:
#     extends: .qa-trigger-generation
#     stage: <a stage after deploy>
#     needs: [<your deploy job>]
#     rules:
#       - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
.qa-trigger-generation:
  # QA_SERVICE_NAME (global, above) is forwarded as-is; redefining it here as "$QA_SERVICE_NAME" would send the
  # literal text "$QA_SERVICE_NAME" downstream.
  variables:
    QA_SERVICE_PROJECT: "$CI_PROJECT_PATH"
    QA_SERVICE_SHA: "$CI_COMMIT_SHA"
    QA_SERVICE_BEFORE_SHA: "$CI_COMMIT_BEFORE_SHA"
  trigger:
    project: "$QA_TESTS_PROJECT"
    branch: {{targetBranch}}

# After deploying this service to an environment, have the test repo check the stories it touches (every service
# deployed? then run their tests there and comment on the story). Add after your deploy job:
#
#   qa-after-deploy-sit:
#     extends: .qa-trigger-post-deploy
#     stage: <a stage after deploy>
#     needs: [<your deploy job>]
#     variables: { QA_ENVIRONMENT: sit }   # a name from environments: in qa-sentinel.config.yaml
#     rules:
#       - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
.qa-trigger-post-deploy:
  variables:
    QA_POST_DEPLOY: "true"
    QA_SERVICE_PROJECT: "$CI_PROJECT_PATH"
    QA_SERVICE_SHA: "$CI_COMMIT_SHA"
  trigger:
    project: "$QA_TESTS_PROJECT"
    branch: {{targetBranch}}

qa-trigger-generation:
  extends: .qa-trigger-generation
  stage: test
  rules:
    - if: $QA_GENERATE_AFTER == "deploy"
      when: never
{{#if skipBranchesMergeRe}}
    # ci.skipBranches: a merge commit names its branch.
    - if: $CI_COMMIT_MESSAGE =~ /Merge branch '(?:{{skipBranchesMergeRe}})/
      when: never
{{/if}}
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Re-run by hand: Build › Pipelines › New pipeline on the default branch (generates for its latest commit).
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
{{/if}}
