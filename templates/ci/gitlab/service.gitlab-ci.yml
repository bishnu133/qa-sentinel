# qa-sentinel – SERVICE repo pipeline (Phase 1 gap report + Phase 2 trigger)
#
# Include from each service repo's .gitlab-ci.yml:
#   include:
#     - project: "my-group/qa-tests"          # your test repo
#       ref: {{targetBranch}}
#       file: "ci/qa-sentinel/service.gitlab-ci.yml"
#   variables:
#     QA_TESTS_PROJECT: "my-group/qa-tests"
#
# CI/CD variables (masked, protected): ANTHROPIC_API_KEY, QA_SENTINEL_GITLAB_TOKEN (api scope)
# The service's name in qa-sentinel.config.yaml must equal $CI_PROJECT_NAME (or set QA_SERVICE_NAME).

variables:
  QA_SENTINEL_VERSION: "0.1"
  QA_SERVICE_NAME: "$CI_PROJECT_NAME"

.qa-sentinel:
  image: node:22
  variables:
    GIT_DEPTH: 0
  before_script:
    - npm i -g @anthropic-ai/claude-code "qa-sentinel@${QA_SENTINEL_VERSION}"
    - git clone --depth 1 --branch {{targetBranch}} "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${QA_TESTS_PROJECT}.git" /tmp/qa-tests
    - (cd /tmp/qa-tests && npm ci --ignore-scripts)

# Phase 1: read-only QA impact comment on every MR. Never blocks the MR.
qa-gap-report:
  extends: .qa-sentinel
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true
  interruptible: true
  script:
    - >
      qa-sentinel -C /tmp/qa-tests gap-report
      --service "$QA_SERVICE_NAME" --service-path "$CI_PROJECT_DIR"
      --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head "$CI_COMMIT_SHA"
      --out "$CI_PROJECT_DIR/qa-gap-report.md" --post
  artifacts:
    when: always
    paths: [qa-gap-report.md]
    expire_in: 2 weeks

# Phase 2: after merge to the default branch, ask the test repo to generate/update API tests.
qa-trigger-generation:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    QA_SERVICE_NAME: "$QA_SERVICE_NAME"
    QA_SERVICE_PROJECT: "$CI_PROJECT_PATH"
    QA_SERVICE_SHA: "$CI_COMMIT_SHA"
    QA_SERVICE_BEFORE_SHA: "$CI_COMMIT_BEFORE_SHA"
  trigger:
    project: "$QA_TESTS_PROJECT"
    branch: {{targetBranch}}
