# qa-sentinel – TEST repo pipeline
#
# Include from the test repo's .gitlab-ci.yml:
#   include:
#     - local: "{{testsPrefix}}ci/qa-sentinel/tests.gitlab-ci.yml"
#
# CI/CD variables: ANTHROPIC_API_KEY, QA_SENTINEL_GITLAB_TOKEN (api + write_repository), {{baseUrlEnv}}{{#if webEnabled}}, {{webBaseUrlEnv}} (web){{/if}}{{#if mobileEnabled}}, QA_APPIUM_URL + QA_APP or QA_APP_PACKAGE/QA_BUNDLE_ID + QA_MOBILE_PLATFORM (mobile){{/if}}
# Allow this project's CI_JOB_TOKEN to read the service repos (Settings › CI/CD › Job token permissions).
#
# Security notes:
# - qa-sentinel never passes QA_SENTINEL_GITLAB_TOKEN or CI_JOB_TOKEN to the agent or to test runs, and pushes
#   with a one-off URL (the token is never written to .git/config).
# - Run these jobs on runners whose network can reach only GitLab, the Anthropic API, your package registry and
#   the QA environment. Generated tests are code; isolate where they run.

variables:
  QA_SENTINEL_VERSION: "0.8.0-beta.1"
  # Where to install qa-sentinel from: set QA_SENTINEL_PACKAGE as a group/project CI/CD variable, e.g.
  # "github:bishnu133/qa-sentinel#main" until it is on npm. Default: qa-sentinel@$QA_SENTINEL_VERSION.
  # (Not defined here on purpose: trigger jobs forward YAML variables downstream, where they override CI/CD variables.)

# Install qa-sentinel from QA_SENTINEL_PACKAGE. A GitHub source ("github:owner/repo#branch") is cloned, built and
# packed here first: npm's own build-on-install for git dependencies is unreliable for global installs.
.qa-sentinel-install:
  script:
    - |
      if [ "${QA_INSTALL_SKIP:-}" != "1" ] && ! command -v qa-sentinel >/dev/null 2>&1; then
        qa_pkg="${QA_SENTINEL_PACKAGE:-qa-sentinel@${QA_SENTINEL_VERSION}}"
        case "$qa_pkg" in
          github:*|git+https://github.com/*|https://github.com/*)
            src="${qa_pkg#github:}"; src="${src#git+}"; src="${src#https://github.com/}"
            repo="${src%%#*}"; repo="${repo%.git}"; ref="main"
            case "$src" in *"#"*) ref="${src#*#}" ;; esac
            rm -rf /tmp/qa-sentinel-src /tmp/qa-sentinel-*.tgz
            git clone -q --depth 1 --branch "$ref" "https://github.com/${repo}.git" /tmp/qa-sentinel-src
            (cd /tmp/qa-sentinel-src && npm ci --no-audit --no-fund --loglevel=error && npm pack --silent --pack-destination /tmp > /dev/null)
            qa_pkg="$(ls /tmp/qa-sentinel-*.tgz | head -n 1)"
            ;;
        esac
        npm i -g --no-audit --no-fund --loglevel=error "$qa_pkg"
      fi
      if [ "${QA_INSTALL_SKIP:-}" != "1" ]; then qa-sentinel --version; fi

.qa-node:
  image: mcr.microsoft.com/playwright:v1.49.0-noble
  before_script:
{{#if testsSubdir}}
    # The test repo is a folder of this repository: install (its own lockfile, else the workspace root's) and run from there.
    - cd "{{testsSubdir}}"
    - if [ -f package-lock.json ]; then npm ci; else (cd "$CI_PROJECT_DIR" && npm ci); fi
{{/if}}
{{#if testsSubdirNone}}
    - npm ci
{{/if}}
{{#if webEnabled}}
    # Browser matching the @playwright/test version in the lockfile (a no-op when the image already has it).
    - npx playwright install chromium
{{/if}}
  # Test data a failed or killed test left behind (testData.cleanup: ledger): deleted even when the job fails.
  # after_script is a new shell: the environment's URL comes back from .qa-env.sh (written after QA_ENV_START).
  after_script:
    - cd "$CI_PROJECT_DIR/{{testsPrefix}}."
    - if [ -f "$CI_PROJECT_DIR/.qa-env.sh" ]; then . "$CI_PROJECT_DIR/.qa-env.sh"; fi
    - if ls "{{ledgerDir}}"/*.jsonl >/dev/null 2>&1; then export QA_INSTALL_SKIP=0; else export QA_INSTALL_SKIP=1; fi
    - !reference [.qa-sentinel-install, script]
    - if [ "$QA_INSTALL_SKIP" = "0" ]; then qa-sentinel data sweep --older-than 0 --out qa-data-sweep.md || echo "WARNING qa-sentinel – test data was left behind on the test environment (see above and qa-data-sweep.md)"; fi

{{#if isMaintenance}}
# Phase 2: triggered by a service repo after merge. Opens an MR with new/updated API tests.
qa-generate:
  extends: .qa-node
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" && $QA_SERVICE_NAME
  # ONE write-enabled generation at a time for the whole test repo: services share test-map.yaml, clients and fixtures.
  resource_group: qa-sentinel-generate
  timeout: 45m
  script:
    - npm i -g --no-audit --no-fund --loglevel=error @anthropic-ai/claude-code
    - !reference [.qa-sentinel-install, script]
    - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${QA_SERVICE_PROJECT}.git" "/tmp/services/$QA_SERVICE_NAME"
    # Pin the service to the merged commit and drop the token-bearing remote before any agent runs.
    - git -C "/tmp/services/$QA_SERVICE_NAME" checkout --quiet --detach "$QA_SERVICE_SHA"
    - git -C "/tmp/services/$QA_SERVICE_NAME" remote remove origin
    - git config user.name "qa-sentinel" && git config user.email "qa-sentinel@noreply.local"
    # Optional ephemeral QA environment (e.g. start the services under test). Set QA_ENV_START in your
    # .gitlab-ci.yml variables, e.g. "source qa-env/start.sh"; it may export {{baseUrlEnv}}.
    - if [ -n "$QA_ENV_START" ]; then eval "$QA_ENV_START"; fi
    - echo "export {{baseUrlEnv}}='${{baseUrlEnv}}'" > "$CI_PROJECT_DIR/.qa-env.sh"
    - git remote set-url origin "${CI_SERVER_URL}/${CI_PROJECT_PATH}.git"   # strip the job token GitLab put in .git/config
{{#if healingBubblegum}}
    # Locators healed in the latest scheduled run (qa-healed job): the agent fixes the page objects it touches.
    - 'curl -sfL --header "JOB-TOKEN: $CI_JOB_TOKEN" -o qa-healed.json "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/{{targetBranch}}/raw/qa-healed.json?job=qa-healed" || rm -f qa-healed.json'
{{/if}}
    # A manually started upstream pipeline has no "before" commit (all zeros): compare with the parent instead.
    - |
      QA_BASE="$QA_SERVICE_BEFORE_SHA"
      case "$QA_BASE" in ""|0000000000000000000000000000000000000000) QA_BASE="$(git -C "/tmp/services/$QA_SERVICE_NAME" rev-parse "$QA_SERVICE_SHA~1")" ;; esac
    - >
      qa-sentinel generate
      --service "$QA_SERVICE_NAME" --service-path "/tmp/services/$QA_SERVICE_NAME"
      --base "$QA_BASE" --head "$QA_SERVICE_SHA" --push
      ${QA_ENVIRONMENT:+--env "$QA_ENVIRONMENT"}
  artifacts:
    when: always
    paths: [{{testsPrefix}}qa-sentinel-summary.md, {{testsPrefix}}.qa-sentinel/runs/]
    expire_in: 2 weeks

{{/if}}
# Story review before development: start a pipeline with QA_STORY_REVIEW_KEY=SHOP-12 (e.g. from a Jira Automation
# rule "when an issue moves to Ready for Dev → send web request" to this project's pipeline trigger URL).
qa-story-review:
  extends: .qa-node
  stage: test
  rules:
    - if: $QA_STORY_REVIEW_KEY
  script:
    - npm i -g --no-audit --no-fund --loglevel=error @anthropic-ai/claude-code
    - !reference [.qa-sentinel-install, script]
    - qa-sentinel review-story --story "$QA_STORY_REVIEW_KEY" --post
  artifacts:
    when: always
    paths: [{{testsPrefix}}qa-story-review.md, {{testsPrefix}}.qa-sentinel/runs/]
    expire_in: 2 weeks

# Blocking gate for agent MRs (and any MR touching tests): the same independent checks qa-sentinel runs after
# generation – write policy, type-check, changed specs with JUnit. Fails unless VERIFIED.
qa-agent-mr-checks:
  extends: .qa-node
  stage: test
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^qa-sentinel\//
      variables: { QA_VERIFY_POLICY: "--policy" }
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["{{testsPrefix}}{{apiDir}}/**/*"{{#if webEnabled}}, "{{testsPrefix}}{{webDir}}/**/*", "{{testsPrefix}}{{pagesDir}}/**/*"{{/if}}{{#if mobileEnabled}}, "{{testsPrefix}}{{mobileDir}}/**/*", "{{testsPrefix}}{{screensDir}}/**/*"{{/if}}]
  script:
    - !reference [.qa-sentinel-install, script]
    # Optional ephemeral QA environment (e.g. start the services under test). Set QA_ENV_START in your
    # .gitlab-ci.yml variables, e.g. "source qa-env/start.sh"; it may export {{baseUrlEnv}}.
    - if [ -n "$QA_ENV_START" ]; then eval "$QA_ENV_START"; fi
    - echo "export {{baseUrlEnv}}='${{baseUrlEnv}}'" > "$CI_PROJECT_DIR/.qa-env.sh"
    - qa-sentinel verify $QA_VERIFY_POLICY --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --out qa-verify.md
  artifacts:
    when: always
    reports:
      junit: [{{testsPrefix}}.qa-sentinel/runs/*/junit*.xml{{#if mobileEnabled}}, {{testsPrefix}}.qa-sentinel/runs/*/junit-mobile/*.xml{{/if}}]
    paths: [{{testsPrefix}}qa-verify.md, {{testsPrefix}}.qa-sentinel/runs/, {{testsPrefix}}playwright-report/]
    expire_in: 2 weeks

# Regular runs of the whole suite{{#if webEnabled}} (API and web, one report for the showcase stage){{/if}}: on schedule, or after a
# deployment (pass QA_TEST_ARGS, e.g. --grep @service:orders).
api-tests:
  extends: .qa-node
  stage: test
{{#if webEnabled}}
  variables:
    # Runtime locator healing for web tests: "bubblegum" or "off". Never used by qa-generate / qa-agent-mr-checks.
    QA_HEALING: "{{healingVar}}"
{{/if}}
  rules:
    - if: $QA_STORY_REVIEW_KEY   # a story-review pipeline runs only that job
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_COMMIT_BRANCH == "{{targetBranch}}"
  script:
    # Optional ephemeral QA environment (e.g. start the services under test). Set QA_ENV_START in your
    # .gitlab-ci.yml variables, e.g. "source qa-env/start.sh"; it may export {{baseUrlEnv}}.
    - if [ -n "$QA_ENV_START" ]; then eval "$QA_ENV_START"; fi
    - echo "export {{baseUrlEnv}}='${{baseUrlEnv}}'" > "$CI_PROJECT_DIR/.qa-env.sh"
{{#if healingBubblegum}}
    # Bubblegum's engine (Python) for runtime healing; the Node client comes from package.json.
    - if [ "$QA_HEALING" = "bubblegum" ]; then python3 -m pip install --quiet --break-system-packages "bubblegum-ai[web]" || (apt-get update -qq && apt-get install -y -qq python3-pip >/dev/null && python3 -m pip install --quiet --break-system-packages "bubblegum-ai[web]"); fi
{{/if}}
    - {{suiteRunCommand}} ${QA_TEST_ARGS}
  artifacts:
    when: always
    reports:
      junit: {{testsPrefix}}test-results/junit.xml
    paths: [{{testsPrefix}}playwright-report/, {{testsPrefix}}test-results/]
    expire_in: 2 weeks

{{#if mobileEnabled}}
# The mobile suite (WebdriverIO + Appium) needs a device: it runs when QA_APPIUM_URL points at an Appium server
# (a device farm, or a runner with an emulator). Set QA_APP (or QA_APP_PACKAGE / QA_BUNDLE_ID) and QA_MOBILE_PLATFORM too.
mobile-tests:
  extends: .qa-node
  stage: test
  rules:
    - if: $QA_STORY_REVIEW_KEY
      when: never
    - if: $QA_APPIUM_URL == null || $QA_APPIUM_URL == ""
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_COMMIT_BRANCH == "{{targetBranch}}"
  script:
    - if [ -n "$QA_ENV_START" ]; then eval "$QA_ENV_START"; fi
    - echo "export {{baseUrlEnv}}='${{baseUrlEnv}}'" > "$CI_PROJECT_DIR/.qa-env.sh"
    - {{mobileRunCommand}} ${QA_MOBILE_TEST_ARGS}
  artifacts:
    when: always
    reports:
      junit: {{testsPrefix}}test-results/mobile/junit/*.xml
    paths: [{{testsPrefix}}test-results/mobile/]
    expire_in: 2 weeks

{{/if}}
{{#if healingBubblegum}}
# Healed steps from the run above: page-object fixes to make (qa-healed.md); fails when tests.web.bubblegum.failOnHeal.
qa-healed:
  extends: .qa-node
  stage: test
  needs: [api-tests]
  rules:
    - if: $QA_STORY_REVIEW_KEY   # a story-review pipeline runs only that job
      when: never
    # Also (especially) when tests failed: a step Bubblegum could not heal is listed too.
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api" || $CI_COMMIT_BRANCH == "{{targetBranch}}"
      when: always
  script:
    - !reference [.qa-sentinel-install, script]
    - qa-sentinel healed
  artifacts:
    when: always
    paths: [{{testsPrefix}}qa-healed.md, {{testsPrefix}}qa-healed.json]
    expire_in: 4 weeks

{{/if}}
{{#if isMaintenance}}
# Learning from review: weekly, turn what reviewers changed in agent MRs before merging into rules in
# kb/review-lessons.md, proposed as an MR (a human decides what the agents learn). Turn on with a schedule that sets
# QA_LESSONS=true.
qa-lessons:
  extends: .qa-node
  stage: test
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $QA_LESSONS == "true" && $CI_PIPELINE_SOURCE == "schedule"
  script:
    - npm i -g --no-audit --no-fund --loglevel=error @anthropic-ai/claude-code
    - !reference [.qa-sentinel-install, script]
    # The target branch, and an open lessons MR (if any), so a rerun builds on it instead of replacing a reviewer's edits.
    - git fetch -q origin "{{targetBranch}}" "+refs/heads/qa-sentinel/review-lessons:refs/remotes/origin/qa-sentinel/review-lessons" || git fetch -q origin "{{targetBranch}}"
    - git config user.name "qa-sentinel" && git config user.email "qa-sentinel@noreply.local"
    - git remote set-url origin "${CI_SERVER_URL}/${CI_PROJECT_PATH}.git"   # strip the job token GitLab put in .git/config
    - qa-sentinel lessons --since 90d --push
  artifacts:
    when: always
    paths: [{{testsPrefix}}qa-lessons.md, {{testsPrefix}}.qa-sentinel/runs/]
    expire_in: 4 weeks

{{/if}}
# Showcase: after a full run of the suite, attach test evidence to every Jira story whose acceptance criteria all
# passed, once per story (QA can ask again with the "qa-showcase-refresh" label). Turn on with QA_SHOWCASE=true
# (needs requirements.jira in qa-sentinel.config.yaml and JIRA_EMAIL + JIRA_API_TOKEN, or JIRA_PAT).
qa-showcase:
  extends: .qa-node
  stage: test
  needs: [api-tests{{#if mobileEnabled}}, { job: mobile-tests, optional: true }{{/if}}]
  rules:
    - if: $QA_STORY_REVIEW_KEY   # a story-review pipeline runs only that job
      when: never
    - if: $QA_SHOWCASE == "true" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api" || $CI_COMMIT_BRANCH == "{{targetBranch}}")
  script:
    - !reference [.qa-sentinel-install, script]
    # A full ffmpeg builds the single showcase video (title cards + the recorded tests).
    - command -v ffmpeg >/dev/null || (apt-get update -qq && apt-get install -y -qq ffmpeg >/dev/null)
    # The showcase re-records the chosen web{{#if mobileEnabled}} and mobile{{/if}} tests slowly, so the environment must be up{{#if mobileEnabled}} (and Appium, for the app){{/if}}.
    - if [ -n "$QA_ENV_START" ]; then eval "$QA_ENV_START"; fi
    - echo "export {{baseUrlEnv}}='${{baseUrlEnv}}'" > "$CI_PROJECT_DIR/.qa-env.sh"
    - qa-sentinel showcase ${QA_ENVIRONMENT:+--env "$QA_ENVIRONMENT"}
  artifacts:
    when: always
    paths: [{{testsPrefix}}qa-showcase.md, {{testsPrefix}}qa-showcase/, {{testsPrefix}}.qa-sentinel/showcase/]
    expire_in: 2 weeks
