    endpoints:
      POST /payments/authorize: [tests/api/payments/payments.spec.ts]
      GET /payments/{id}: [tests/api/payments/payments.spec.ts]
    screens: {}
  notifications-service:
    path: ../notifications-service
    openapi: openapi.yaml
    endpoints:
      POST /notifications: [tests/api/notifications/notifications.spec.ts]
      GET /notifications: [tests/api/notifications/notifications.spec.ts]
    screens: {}
unmapped: []
