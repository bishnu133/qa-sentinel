jenkins:
  systemMessage: "qa-sentinel Jenkins sandbox (local, throwaway)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy: loggedInUsersCanDoAnything
  # npm, Node and git in the pipeline's containers trust the same CA bundle (with your company's root, if any).
  globalNodeProperties:
    - envVars:
        env:
          - key: NODE_EXTRA_CA_CERTS
            value: /qa-certs/ca-bundle.pem
          - key: GIT_SSL_CAINFO
            value: /qa-certs/ca-bundle.pem
          - key: npm_config_cafile
            value: /qa-certs/ca-bundle.pem
          # The storefront for web tests (the API URL comes from the qa-base-url credential).
          - key: QA_WEB_URL
            value: "${SANDBOX_QA_WEB_URL}"
          # Where the pipelines install qa-sentinel from (default: this repo's main on GitHub).
          - key: QA_SENTINEL_PACKAGE
            value: "${SANDBOX_QA_SENTINEL_PACKAGE}"
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              id: qa-base-url
              secret: "${SANDBOX_QA_BASE_URL}"
          - string:
              id: anthropic-api-key
              secret: "${SANDBOX_ANTHROPIC_API_KEY}"
          - string:
              id: qa-sentinel-gitlab-token
              secret: "${SANDBOX_GITLAB_TOKEN}"
jobs:
  # The test repo's suite job, from the ShopLite sandbox's qa-tests repo (mounted at /work).
  - script: >
      pipelineJob('qa-api-tests') {
        parameters {
          stringParam('QA_TEST_ARGS', '', 'Extra arguments for the test command')
          booleanParam('CHANGED_ONLY', false, 'Run only specs changed vs main (agent MRs)')
        }
        definition {
          cpsScm {
            scm { git { remote { url('file:///work/shoplite-local/qa-tests') }; branch('*/main') } }
            scriptPath('ci/qa-sentinel/Jenkinsfile.tests')
          }
        }
      }
